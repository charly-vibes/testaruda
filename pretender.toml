[pretender]
mode = "tiered"
languages = ["auto"]
exclude = ["vendor/**", "node_modules/**", "**/*_generated.*", "target/**"]

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

# App-level thresholds match current codebase baseline.
# Tighten as refactoring progresses.
[thresholds]
cyclomatic_max = 10
cognitive_max = 20
function_lines_max = 200
file_lines_max = 5000
# file_lines and nesting_max are tightenable once store.rs is split
# (4585 lines) and main() is refactored (cyclomatic 67).
nesting_max = 5
params_max = 4
abc_max = 60

[thresholds.test]
cyclomatic_max = 5
cognitive_max = 8
function_lines_max = 200
min_assertions = 1
abc_max = 80
