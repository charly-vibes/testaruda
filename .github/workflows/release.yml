# Release workflow — build cross-platform binaries and publish a GitHub release
#
# Triggered by pushing a version tag (e.g., `git tag v0.1.0 && git push --tags`).
# Creates a GitHub Release with pre-built binaries for Linux, macOS, and Windows,
# then auto-updates the homebrew-charly tap formula and scoop-charly bucket manifest.
#
# Required secrets:
#   GITHUB_TOKEN       - automatically provided by GitHub Actions
#   TAP_GITHUB_TOKEN   - PAT with repo write access to homebrew-charly and scoop-charly
#   CARGO_REGISTRY_TOKEN    - crates.io API token for publishing the crate

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Build aarch64 Linux
        run: cargo build --release --workspace --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          for bin in testaruda testaruda-adapter-rust testaruda-adapter-python testaruda-adapter-typescript testaruda-adapter-clojure; do
            cp "target/x86_64-unknown-linux-gnu/release/${bin}" "bins/linux_amd64/${bin}"
            cp "target/aarch64-unknown-linux-gnu/release/${bin}" "bins/linux_arm64/${bin}"
          done

      - name: Smoke staged binaries
        run: |
          set -e
          ./bins/linux_amd64/testaruda --version
          for bin in bins/linux_amd64/testaruda-adapter-*; do
            echo '{"command":"handshake"}' | "$bin" | grep -q '"ok":true'
          done
          echo "smoke OK: linux_amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --workspace --target x86_64-apple-darwin

      - name: Build aarch64 macOS
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          for bin in testaruda testaruda-adapter-rust testaruda-adapter-python testaruda-adapter-typescript testaruda-adapter-clojure; do
            cp "target/x86_64-apple-darwin/release/${bin}" "bins/darwin_amd64/${bin}"
            cp "target/aarch64-apple-darwin/release/${bin}" "bins/darwin_arm64/${bin}"
          done

      - name: Smoke staged binaries
        run: |
          set -e
          ./bins/darwin_amd64/testaruda --version
          for bin in bins/darwin_amd64/testaruda-adapter-*; do
            echo '{"command":"handshake"}' | "$bin" | grep -q '"ok":true'
          done
          echo "smoke OK: darwin_amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          for bin in testaruda testaruda-adapter-rust testaruda-adapter-python testaruda-adapter-typescript testaruda-adapter-clojure; do
            cp "target/x86_64-pc-windows-msvc/release/${bin}.exe" "bins/windows_amd64/${bin}.exe"
          done

      - name: Smoke staged binaries
        shell: bash
        run: |
          set -e
          ./bins/windows_amd64/testaruda.exe --version
          for bin in bins/windows_amd64/testaruda-adapter-*.exe; do
            echo '{"command":"handshake"}' | "$bin" | grep -q '"ok":true'
          done
          echo "smoke OK: windows_amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  quality:
    name: Quality gate (workspace, tag commit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - uses: extractions/setup-just@v2

      # Workspace quality gates on the exact commit being published —
      # build jobs compile but never test; a red tag commit must not ship
      # (testaruda-h7bv.3). Recipes are the same workspace-wide gates PRs
      # run via `just ci` (h7bv.1 contract).
      - name: Workspace quality gates
        run: |
          just fmt-check
          just lint
          just test

  publish:
    name: Publish Release
    needs: [build-linux, build-darwin, build-windows, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      - name: Package archives and checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # upload-artifact does not preserve file permissions across the
          # artifact roundtrip — restore the exec bit or the archives ship
          # 644 binaries and `curl | tar xz` installs are not runnable (DDL-3av).
          chmod +x -- bins/*/*

          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            tar -czf "dist/testaruda_${VERSION}_${plat}.tar.gz" \
              -C "bins/${plat}" testaruda testaruda-adapter-rust testaruda-adapter-python \
                testaruda-adapter-typescript testaruda-adapter-clojure
          done

          (cd bins/windows_amd64 && \
           zip "../../dist/testaruda_${VERSION}_windows_amd64.zip" \
             testaruda.exe testaruda-adapter-rust.exe testaruda-adapter-python.exe \
               testaruda-adapter-typescript.exe testaruda-adapter-clojure.exe)

          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Verify archive completeness (h7bv.2 gate)
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            python3 scripts/verify-release-archive.py \
              --archive "dist/testaruda_${VERSION}_${plat}.tar.gz" \
              --checksums dist/checksums.txt --platform "$plat"
          done
          python3 scripts/verify-release-archive.py \
            --archive "dist/testaruda_${VERSION}_windows_amd64.zip" \
            --checksums dist/checksums.txt --platform windows_amd64
          echo "archive completeness verified for all 5 platforms"

      - name: Create GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            $PRERELEASE \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/charly-vibes/homebrew-charly.git" /tmp/tap
          python3 scripts/update-homebrew.py \
            /tmp/tap/Formula/testaruda.rb \
            "${VERSION}" "${TAG}" dist/checksums.txt
          cd /tmp/tap
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/testaruda.rb
          git diff --staged --quiet || git commit -m "Update testaruda to ${VERSION}"
          git push

      - name: Update Scoop bucket
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/charly-vibes/scoop-charly.git" /tmp/scoop
          python3 scripts/update-scoop.py \
            /tmp/scoop/bucket/testaruda.json \
            "${VERSION}" "${TAG}" dist/checksums.txt
          cd /tmp/scoop
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add bucket/testaruda.json
          git diff --staged --quiet || git commit -m "Update testaruda to ${VERSION}"
          git push