# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install gate tools
        # Pinned to locally-verified versions for CI parity with the pre-push
        # gate (testaruda-b7ks). `espectacular` provides the `ah` binary;
        # `dont-cli` provides the `dont` binary (epistemic gate, check-claims);
        # bump versions together with local installs. See also: `ah doctor`.
        run: |
          cargo install --locked pretender@0.7.0 espectacular@0.8.0 dont-cli@0.2.2 wai-cli@2026.9.28

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked dulce-de-leche@0.7.0
          npm install -g @fission-ai/openspec@0.19.0
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          openspec validate --all >/dev/null
      # Run the exact same command as local development
      - name: Run CI pipeline
        run: just ci

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: testaruda-linux-amd64
          path: target/release/testaruda

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        # Adapter children receive explicit cwd at spawn time (testaruda-pzh6),
        # but tarpaulin's instrumentation adds flakiness under parallel loads.
        run: cargo tarpaulin -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false