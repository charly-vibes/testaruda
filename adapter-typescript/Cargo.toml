[package]
name = "adapter-typescript"
version = "0.1.0"
edition = "2021"
description = "testaruda adapter for TypeScript/JavaScript — tree-sitter-based import extraction and test discovery"

[[bin]]
name = "testaruda-adapter-typescript"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"

[dev-dependencies]
tempfile = "3"