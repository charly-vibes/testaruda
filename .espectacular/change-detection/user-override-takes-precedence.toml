id = "user-override-takes-precedence"
description = "Contract for: User-configured testaruda.toml overrides auto-detection defaults"
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.1.0"

[[tests.shell]]
command = "grep -q 'load_or_default' src/config.rs && grep -q 'load' src/config.rs && echo 'user config override code exists'"
timeout_seconds = 10

[[tests.shell]]
command = "cargo test config::tests::flat_format_parses_via_config_load"
timeout_seconds = 60
