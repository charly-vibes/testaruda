[package]
name = "testaruda"
version = "0.2.5"
edition = "2021"
description = "Language-agnostic test selection engine — compute the affected test set from a code change via provenance-semiring dependency analysis"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/testaruda"
keywords = ["test-selection", "dependency-analysis", "testing", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "adapter-*/src/**/*", "adapter-*/Cargo.toml"]

[workspace]
members = ["adapter-typescript", "adapter-clojure"]

[[bin]]
name = "testaruda"
path = "src/main.rs"

[[bin]]
name = "testaruda-adapter-rust"
path = "src/bin/adapter-rust.rs"

[[bin]]
name = "testaruda-adapter-python"
path = "src/bin/adapter-python.rs"

[dependencies]
# Core engine
ascent = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Glob pattern matching for must-run rules (TIA-SAFE-009)
glob = "0.3"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Content hashing
blake3 = "1"

# File scanning for adapters
walkdir = "2"
clap-markdown = "0.1"
clap_complete = "4.6.7"
genesis-vibes = "0.2"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
clap-markdown = "0.1"
